[[projects]]
id = "soft-gripper"
title = "DRL-Based Grasping Control of a Logarithmic-Spiral Soft Gripper"
role = "Core Team Member"
period = "Oct. 2024 – Sep. 2025"
description = "This project investigates reinforcement learning for grasping with a cable-driven logarithmic-spiral soft gripper. A PPO policy is trained in MuJoCo to control continuous cable actuation. A six-DoF robotic arm and TPU-printed soft gripper form the hardware platform, demonstrated through teleoperated grasping."
tags = ["Soft Robotics", "Reinforcement Learning", "MuJoCo", "PPO"]
preview = "/projects/soft-gripper/hardware.webp"
previewAlt = "A cable-driven soft gripper mounted on a robotic arm lifting an object during a teleoperated demonstration."
previewDemo = 1

