label = "Simulation Demo"
src = "/projects/soft-gripper/simulation.mp4"
poster = "/projects/soft-gripper/simulation.webp"
description = "In simulation, the rigid robotic arm approaches the target object, and the logarithmic-spiral soft gripper then grasps it under the control of a reinforcement learning policy."

